<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine Proposal 💖</title>
  <style>
    body {
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Comic Sans MS', cursive;
      text-align: center;
      padding-top: 60px;
    }

    h1 {
      font-size: 38px;
      color: #b30059;
    }

    button {
      font-size: 22px;
      padding: 15px 35px;
      margin: 20px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    button:hover {
      transform: scale(1.1);
    }

    .yes {
      background-color: #ff4d6d;
      color: white;
    }

    .no {
      background-color: #666;
      color: white;
    }

    .gifs img {
      width: 240px;
      margin: 12px;
      border-radius: 16px;
    }
  </style>
</head>
<body>

  <h1>💌 Mr. Jain, will you be my Valentine? 💘</h1>

  <button class="yes" onclick="yesClicked()">Yes 💖</button>
  <button class="no" onclick="noClicked()">No 💔</button>

  <div id="content"></div>

  <script>
    function yesClicked() {
      document.getElementById("content").innerHTML = `
        <h1>YAYYYY!!! 🥰💋🤗</h1>
        <div class="gifs">
          <img src="https://media.giphy.com/media/l2QDM9Jnim1YVILXa/giphy.gif">
          <img src="https://media.giphy.com/media/od5H3PmEG5EVq/giphy.gif">
          <img src="https://media.giphy.com/media/wnsgren9NtITS/giphy.gif">
          <img src="https://media.giphy.com/media/1hqb8LwPS2xCNCpWH8/giphy.gif">
          <img src="https://media.giphy.com/media/3o7abKhOpu0NwenH3O/giphy.gif">
        </div>
      `;
    }

    function noClicked() {
      document.getElementById("content").innerHTML = `
        <h1>😢 Better luck next Valentine 💔</h1>
      `;
    }
  </script>

</body>
</html>
